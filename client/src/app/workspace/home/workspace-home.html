<section class="max-w-3xl">
  <div
    class="inline-flex size-12 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-700"
  >
    <svg lucideLayoutDashboard class="size-6" aria-hidden="true"></svg>
  </div>

  <h1 class="mt-6 text-3xl font-semibold tracking-tight text-slate-950 sm:text-4xl">
    Welcome, {{ session()?.name }}
  </h1>
  <p class="mt-3 max-w-2xl text-base leading-7 text-slate-600">
    Your private workspace is ready for the notes and categories you want to keep close.
  </p>

  <div class="mt-10 grid gap-4 sm:grid-cols-2">
    <a
      routerLink="/workspace/notes"
      class="block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-indigo-300 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700"
    >
      <svg lucideStickyNote class="size-6 text-indigo-700" aria-hidden="true"></svg>
      <h2 class="mt-4 text-lg font-semibold text-slate-950">Notes</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">
        Capture ideas, details, and reminders in one organized place.
      </p>
    </a>

    <a
      routerLink="/workspace/categories"
      class="block rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-indigo-300 hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700"
    >
      <svg lucideTags class="size-6 text-indigo-700" aria-hidden="true"></svg>
      <h2 class="mt-4 text-lg font-semibold text-slate-950">Categories</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">
        Group related notes so they are easy to find when you need them.
      </p>
    </a>
  </div>
</section>
