<div class="min-h-screen bg-slate-50 text-slate-950">
  <header class="border-b border-slate-200 bg-white">
    <div
      class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6 lg:px-8"
    >
      <a
        routerLink="/workspace"
        class="inline-flex items-center gap-3 font-semibold tracking-tight text-slate-950"
      >
        <span
          class="inline-flex size-9 items-center justify-center rounded-xl bg-indigo-700 text-white"
        >
          <svg lucideNotebookPen class="size-5" aria-hidden="true"></svg>
        </span>
        <span>NoteKeeper</span>
      </a>

      <div class="flex items-center gap-3">
        <span class="hidden text-sm text-slate-600 sm:inline">{{ session()?.name }}</span>
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 hover:text-slate-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700"
          (click)="signOut()"
          [disabled]="isSigningOut()"
          [attr.aria-busy]="isSigningOut()"
        >
          <svg lucideLogOut class="size-4" aria-hidden="true"></svg>
          Sign out
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
    <router-outlet />
  </main>
</div>
