name: Deploy NoteKeeper API

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Restore dependencies
        run: dotnet restore NoteKeeper.slnx
        working-directory: server

      - name: Build solution
        run: dotnet build NoteKeeper.slnx --configuration Release --no-restore
        working-directory: server

      - name: Run tests
        run: dotnet test NoteKeeper.slnx --configuration Release --no-build
        working-directory: server

      - name: Restore EF Core tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json
        working-directory: server

      - name: Apply database migrations
        run: |
          for attempt in {1..6}; do
            if dotnet ef database update \
              --project src/Infraestrutura/NoteKeeper.Infraestrutura.csproj \
              --startup-project src/Api/NoteKeeper.Api.csproj \
              --configuration Release \
              --no-build; then
              exit 0
            fi

            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi

            echo "Database is unavailable. Retrying migration in 20 seconds."
            sleep 20
          done
        working-directory: server
        env:
          ConnectionStrings__SqlServer: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      - name: Publish API
        run: >
          dotnet publish src/Api/NoteKeeper.Api.csproj
          --configuration Release
          --no-build
          --output "${{ runner.temp }}/notekeeper-api"
        working-directory: server

      - name: Add client to API package
        run: |
          mkdir -p "${{ runner.temp }}/notekeeper-api/wwwroot"
          cp -r client/dist/client/browser/. "${{ runner.temp }}/notekeeper-api/wwwroot"

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: notekeeper-api-aleclui
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/notekeeper-api
